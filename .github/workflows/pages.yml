# Publishes the UI to GitHub Pages as a clickable preview.
#
# The preview runs on the committed fixtures in src/mocks: there is no backend
# behind it, and there cannot be. The real app needs Ollama, a 5GB pair of
# models and a persistent vector index, none of which fit a static host. The
# banner in the app says so, so nobody mistakes sample data for live data.
#
# Ask-bar summaries DO work in the preview: they are arithmetic over the same
# fixture the dashboard draws, so client.ts computes them rather than faking
# them. Retrieval and generation stay off, because faking those would be a lie.
name: Deploy preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION = 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vite 8 needs node:util.styleText, added in 20.12.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Project site lives at /<repo>/, and the app runs on fixtures.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DEMO: '1'
        run: npm run build

      - name: SPA fallback
        # Pages has no rewrite rules, so a deep link like /metrics would 404.
        # Serving index.html as the 404 page hands those paths to the router.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
